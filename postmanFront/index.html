<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DAW Postman Clone</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="main-container">
        <h1>DAW Postman Clone</h1>
        
        <div class="control-panel">
            <select id="methodSelect">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="DELETE">DELETE</option>
            </select>
            
            <input type="text" id="urlInput" placeholder="Enter API URL (e.g., http://localhost:8085/api/users)">
            
            <button id="sendBtn">Send Request</button>
        </div>

        <div class="request-body-container">
            <label for="jsonInput">Request Body (JSON):</label>
            <textarea id="jsonInput" placeholder='{ "name": "John Doe", "age": 25 }'></textarea>
        </div>

        <div class="response-container">
            <div class="meta-info">
                <strong>Status:</strong> <span id="statusCode">---</span> | 
                <strong>Time:</strong> <span id="responseTime">---</span> ms
            </div>
            <pre id="responseOutput">Response will appear here...</pre>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
